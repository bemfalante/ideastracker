name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Install Rclone
      run: sudo apt-get update && sudo apt-get install -y rclone

    - name: Configure Rclone (OAuth2)
      run: |
        mkdir -p ~/.config/rclone
        cat << EOF > ~/.config/rclone/rclone.conf
        [gdrive]
        type = drive
        client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
        client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
        token = {"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}
        scope = drive
        EOF

    - name: Upload to Google Drive using Rclone
      run: |
        rclone copyto app/build/outputs/apk/debug/app-debug.apk gdrive:${{ secrets.GDRIVE_FOLDER_ID }}/IdeasTracker.apk \
        --drive-acknowledge-abuse \
        -v
