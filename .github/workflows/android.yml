name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

    - name: Upload to Google Drive (OAuth2)
      run: |
        python upload_with_oauth.py app/build/outputs/apk/debug/app-debug.apk ${{ secrets.GDRIVE_FOLDER_ID }} ${{ secrets.GDRIVE_CLIENT_ID }} ${{ secrets.GDRIVE_CLIENT_SECRET }} ${{ secrets.GDRIVE_REFRESH_TOKEN }}

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IdeasTracker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
